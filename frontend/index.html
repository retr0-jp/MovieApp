<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>映画感想ノート</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5" style="max-width: 700px;">
    <h1 class="mb-4">🎬 映画感想ノート</h1>

    <form id="movie-form" class="card card-body mb-4">
      <div class="mb-3">
      <input type="text" id="title" class="form-control" placeholder="映画タイトル" required>
      </div>
      <div class="row mb-3">
      <div class="col">
        <select id="category" class="form-select">
        <option value="アクション">アクション</option>
        <option value="コメディ">コメディ</option>
        <option value="ドラマ">ドラマ</option>
        <option value="ホラー">ホラー</option>
        <option value="SF">SF</option>
        <option value="アニメ">アニメ</option>
        <option value="その他">その他</option>
        </select>
      </div>
      <div class="col">
        <label class="form-label d-block">評価</label>
        <div class="star-rating">
          <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
          <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
          <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
          <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
          <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
        </div>
      </div>
      <div class="col">
        <input type="date" id="watchedDate" class="form-control" required>
      </div>
    </div>
    <div class="mb-3">
      <textarea id="comment" class="form-control" placeholder="感想"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">追加</button>
  </form>

  <div id="movie-list"></div>
    <ul id="movie-list" class="list-unstyled"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
